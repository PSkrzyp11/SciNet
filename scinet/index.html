<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SciNet: portal społecznościowy dla ludzi nauki. Publikuj artykuły, komentuj je i zapisuj teksty z różnych dziedzin."
    />
    <title>SciNet</title>
    <script>
      // Ustawia motyw przed wyświetleniem strony, żeby nie mignęła w złych kolorach
      ;(function () {
        var saved
        try {
          saved = localStorage.getItem('scinet-theme')
        } catch (e) {}
        var theme = saved === 'light' || saved === 'dark' ? saved : 'dark'
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
