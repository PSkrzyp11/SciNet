<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SciNet: artykuły, ciekawostki i odkrycia ze świata nauki pisane przez pasjonatów.">
    <title>SciNet</title>
    <script>
      // Ustawia motyw przed wyświetleniem strony, żeby nie mignęła jasnym tłem
      (function () {
        var theme
        try {
          theme = localStorage.getItem('scinet-theme')
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
